
name: Build F-Translator APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: unzip -q FTranslatorAndroid_cloud_build.zip

      - name: Build APK
        working-directory: FTranslatorAndroid
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F-Translator-APK
          path: FTranslatorAndroid/app/build/outputs/apk/debug/app-debug.apk
